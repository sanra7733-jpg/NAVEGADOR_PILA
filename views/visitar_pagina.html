$def with (error)
<h1>Visitar una pagina web</h1>
<a href="/">Menu</a>
<br><br>

$if error:
    <p style="color:red;"><b>$error</b></p>

<form action="/visitar_pagina" method="post">
    Direccion de la pagina (ej. www.google.com):<br>
    <input type="text" name="url" size="40"><br><br>
    <button type="submit">Visitar</button>
</form>
